<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="C7 Chip Room control panel — a read-only view of what this build can do and what the house is holding.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E">
<title>C7 Control Panel</title>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080a;--panel:#0b1a12;--panel-2:#081410;--ink:#eafff4;--mut:#8fbfa6;
  --line:rgba(240,201,74,.18);--hair:rgba(240,201,74,.32);
  --gold:#f0c94a;--gold-l:#fff4cf;--gold-d:#c68a2e;
  --grn:#2ee08a;--red:#ff6b7d;--amb:#f0b84a;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
body{
  font-family:Inter,"Noto Sans Malayalam",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 60% at 50% -10%,#0b2417,#050d09 55%,#04080a);
  background-color:var(--bg);min-height:100vh;padding-bottom:56px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px;margin:0 auto;padding:0 14px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 16px;background:linear-gradient(180deg,rgba(9,26,17,.97),rgba(7,18,12,.82));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-bottom:18px}
.top h1{font-size:16px;font-weight:900;letter-spacing:-.2px}
.top h1 b{background:linear-gradient(90deg,var(--gold-d),var(--gold) 50%,var(--gold-l));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topr{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.badge{font-size:9.5px;font-weight:900;letter-spacing:1.1px;color:#120a02;
  background:linear-gradient(90deg,var(--gold),var(--gold-l));padding:5px 9px;border-radius:999px;white-space:nowrap}

button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.lang{display:flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;background:rgba(8,20,14,.6)}
.lang button{font-size:10.5px;font-weight:800;padding:5px 11px;background:none;color:var(--mut)}
.lang button[aria-pressed=true]{background:linear-gradient(90deg,var(--gold-d),var(--gold));color:#120a02}

.card{border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),var(--panel-2));padding:18px}
.sec{font-size:11px;font-weight:900;letter-spacing:1.3px;color:var(--gold);text-transform:uppercase;margin:24px 4px 10px}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid rgba(240,201,74,.10)}
.row:last-child{border-bottom:0}
.row .ic{font-size:17px;flex:0 0 auto;width:24px;text-align:center}
.row .nm{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600}
.row .nm small{display:block;font-weight:400;font-size:11px;color:var(--mut);margin-top:3px;line-height:1.45}
.row .vl{flex:0 0 auto;font-size:12.5px;font-weight:800}

.pill{font-size:10.5px;font-weight:900;letter-spacing:.6px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.lock{color:var(--mut);background:rgba(143,191,166,.12);border:1px solid rgba(143,191,166,.22)}
.pill.ok{color:#04180e;background:linear-gradient(90deg,#1fae6b,var(--grn))}
.pill.bad{color:#2a0509;background:linear-gradient(90deg,#e0455c,var(--red))}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fig{border-radius:14px;border:1px solid var(--line);background:rgba(6,16,11,.55);padding:14px}
.fig .lbl{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.fig .val{font-size:26px;font-weight:900;letter-spacing:-.8px;margin-top:6px;
  background:linear-gradient(90deg,var(--gold-l),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.fig .val.plain{background:none;-webkit-text-fill-color:var(--ink)}

.note{font-size:12px;line-height:1.65;color:var(--mut);margin-top:12px}
.note b{color:var(--ink);font-weight:700}
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--mut)}
.foot a{color:var(--gold);text-decoration:none}
.foot a:hover{text-decoration:underline}
.err{border-color:rgba(255,107,125,.4);color:var(--red)}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="top">
  <h1><b>C7</b> <span data-t="title">Control Panel</span></h1>
  <div class="topr">
    <span class="badge" data-t="readonly">🔒 READ ONLY</span>
    <div class="lang" role="group" aria-label="Language">
      <button id="en" aria-pressed="true">EN</button>
      <button id="ml" aria-pressed="false">മല</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="err" class="card err" hidden></div>

  <div class="sec" data-t="moneyTitle">Money controls · locked</div>
  <div class="card"><div class="rows" id="controls"></div>
    <p class="note" data-t="moneyNote"></p>
  </div>

  <div class="sec" data-t="houseTitle">The house</div>
  <div class="figs" id="figures"></div>

  <div class="sec" data-t="invTitle">Invariants</div>
  <div class="card"><div class="rows" id="invariants"></div>
    <p class="note" data-t="invNote"></p>
  </div>

  <div class="sec" data-t="gateTitle">Real-money gates</div>
  <div class="card"><div class="rows" id="gates"></div>
    <p class="note" data-t="gateNote"></p>
  </div>

  <p class="foot"><a href="/" data-t="back">← Back to the chip room</a></p>
</div>

<script src="control.js"></script>
</body>
</html>
